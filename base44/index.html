<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>We've Moved</title>
  <link rel="icon" type="image/png" href="/base44/img/aids.png">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body { height: 100%; }
    body {
      background: #f5f0e8;
      color: #111111;
      font-family: 'Inter', sans-serif;
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      padding: 20px;
    }
    .box {
      background: #ffffff;
      border: 1px solid rgba(0,0,0,0.09);
      border-radius: 16px;
      padding: 40px 32px;
      width: 100%;
      max-width: 440px;
      text-align: center;
    }
    h1 {
      font-size: 1.4rem;
      font-weight: 800;
      margin-bottom: 12px;
    }
    p {
      font-size: 0.95rem;
      color: #4b5563;
      line-height: 1.5;
      margin-bottom: 28px;
    }
    a.btn {
      display: inline-block;
      background: #111111;
      color: #ffffff;
      text-decoration: none;
      font-weight: 700;
      font-size: 0.95rem;
      padding: 14px 28px;
      border-radius: 10px;
      transition: opacity 0.15s ease;
    }
    a.btn:hover { opacity: 0.85; }
  </style>
</head>
<body>
  <div class="box">
    <h1>We're transitioning to Whop</h1>
    <p>Here is your personal link to join:</p>
    <a class="btn" href="https://whop.com/the-inner-table/free-course-a2-86b5/">Join on Whop →</a>
  </div>
</body>
</html>
